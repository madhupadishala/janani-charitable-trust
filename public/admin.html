<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janani · Publishing Admin</title><link rel="stylesheet" href="/cms.css"><body><header><b>JANANI <small>Publishing Studio</small></b><a href="/" target="_blank">View website ↗</a></header><main><section id="login" class="card narrow"><h1>Team sign in</h1><p>Only authorised Janani team members can access publishing.</p><form id="loginform"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="studio" hidden><div class="top"><div><small>OUR WORK & STORIES</small><h1>Publishing Studio</h1><p id="userline"></p></div><button class="quiet" id="logout">Sign out</button></div><nav><button data-tab="posts">Posts</button><button data-tab="compose">Write / Edit</button><button data-tab="team" id="teamtab">Team access</button></nav><section id="posts" class="card"><div class="top"><h2>Content</h2><button id="new">+ New story</button></div><div id="postlist"></div></section><section id="compose" class="card" hidden><h2 id="formheading">New story</h2><form id="postform"><label>Post title<input name="title" maxlength="150" required></label><label>Website section<select name="section"><option value="our-work">Our Work</option><option value="stories">Stories & Updates</option><option value="campaigns">Campaigns</option><option value="events">Events</option><option value="announcements">Announcements</option><option value="impact">Impact Reports</option></select></label><label>Short introduction<textarea name="excerpt" rows="3" maxlength="350"></textarea></label><label>Featured photo<input id="coverfile" type="file" accept="image/jpeg,image/png,image/webp"></label><input type="hidden" name="cover"><img id="coverpreview" class="preview" hidden><label>Content <small>(Use paragraphs, headings, lists, bold text, and photo insertions)</small><div class="editorbar"><button type="button" data-cmd="bold">Bold</button><button type="button" data-cmd="h2">Heading</button><button type="button" data-cmd="insertUnorderedList">List</button><button type="button" id="insertphoto">Insert photo</button><input type="file" id="bodyfile" accept="image/jpeg,image/png,image/webp" hidden></div><div id="editor" contenteditable="true" aria-label="Story content" role="textbox" class="editor"></div></label><div class="actions"><button type="button" id="save">Save draft</button><button type="submit" id="publish">Publish now</button><button type="button" class="quiet" id="cancel">Cancel</button></div></form></section><section id="team" class="card" hidden><h2>Team members</h2><p>Writers can create and publish their own posts immediately. Only admins can create, disable, or manage accounts.</p><form id="userform"><label>Writer email<input type="email" name="email" required></label><label>Temporary password <small>(at least 12 characters; share securely)</small><input name="password" minlength="12" type="password" required></label><label>Access<select name="role"><option value="writer">Content writer</option><option value="admin">Administrator</option></select></label><button>Add team member</button></form><div id="users"></div></section><p id="msg" role="status"></p></section></main><script src="/admin.js" defer></script></body></html>
