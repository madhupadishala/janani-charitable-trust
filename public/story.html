<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janani · Our Work & Stories</title><link rel="stylesheet" href="/cms.css"><body><header><b>JANANI <small>CARE · DIGNITY · ACTION</small></b><a href="/">← Home</a></header><main><article class="card" style="max-width:850px;margin:auto"><div id="story">Loading story…</div></article></main><script>const slug=location.pathname.split('/').pop();fetch('/api/posts/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw Error('Story not found');return r.json()}).then(p=>{document.title=p.title+' | Janani';document.querySelector('#story').replaceChildren();const h=document.createElement('h1');h.textContent=p.title;const sub=document.createElement('p');sub.textContent=p.section.replaceAll('-',' ')+' · '+new Date(p.published_at).toLocaleDateString();document.querySelector('#story').append(h,sub);if(p.cover){const img=document.createElement('img');img.src=p.cover;img.alt=p.title;img.style.cssText='width:100%;max-height:400px;object-fit:cover;border-radius:12px';document.querySelector('#story').append(img);}const body=document.createElement('div');body.innerHTML=p.body;body.style.cssText='font-size:18px;line-height:1.8';document.querySelector('#story').append(body)}).catch(e=>document.querySelector('#story').textContent=e.message);</script></body></html>
